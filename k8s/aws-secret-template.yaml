# aws-secret-template.yaml
#
# PURPOSE: Documents the shape of the Kubernetes Secret "registration-secret"
#          that the secrets-sync init container materialises at pod startup.
#
# HOW IT WORKS:
#   1. The init container (amazon/aws-cli:2.15.0) fetches two Secrets Manager paths:
#        - arch-analyzer/db/registration  → Postgres connection string
#        - arch-analyzer/auth/jwt         → JWT signing key
#   2. It runs `kubectl create secret generic registration-secret --dry-run=client | kubectl apply`
#      to upsert the Secret in namespace arch-analyzer-api.
#   3. The main container consumes it via `envFrom: secretRef: registration-secret`.
#
# DO NOT commit real values here. This file is a template / documentation only.
# The actual Secret is never stored in Git — it lives only in Secrets Manager
# and in the cluster's etcd (encrypted at rest via aws/eks managed key).
#
# To inspect the live secret (base64-encoded):
#   kubectl get secret registration-secret -n arch-analyzer-api -o yaml
#
# To rotate:
#   1. Update the value in AWS Secrets Manager.
#   2. kubectl rollout restart deployment/registration-service -n arch-analyzer-api
#      (the init container re-fetches on next pod start)

apiVersion: v1
kind: Secret
metadata:
  name: registration-secret
  namespace: arch-analyzer-api
  labels:
    app.kubernetes.io/name: registration
    app.kubernetes.io/part-of: arch-analyzer
    app.kubernetes.io/component: api
type: Opaque
stringData:
  # Postgres connection string — sourced from arch-analyzer/db/registration
  # Example format (never commit real values):
  #   Host=<DB_ADDRESS>;Port=5432;Database=archanalyzer;Username=<user>;Password=<pass>
  ConnectionStrings__DefaultConnection: "<fetched-from-secrets-manager>"

  # JWT signing key — sourced from arch-analyzer/auth/jwt
  Jwt__Key: "<fetched-from-secrets-manager>"
