apiVersion: apps/v1
kind: Deployment
metadata:
  name: registration-service
  namespace: arch-analyzer-api
  labels:
    app.kubernetes.io/name: registration
    app.kubernetes.io/part-of: arch-analyzer
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: registration-service
  template:
    metadata:
      labels:
        app: registration-service
        app.kubernetes.io/name: registration
        app.kubernetes.io/part-of: arch-analyzer
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        fsGroup: 10000

      volumes:
        - name: secrets-vol
          emptyDir:
            medium: Memory

      initContainers:
        - name: secrets-sync
          image: amazon/aws-cli:2.15.0
          command:
            - /bin/sh
            - -c
            - |
              set -e

              # Fetch Postgres connection string for registration DB
              DB_SECRET=$(aws secretsmanager get-secret-value \
                --secret-id arch-analyzer/db/registration \
                --query SecretString \
                --output text)
              echo "$DB_SECRET" > /secrets/db.json

              # Fetch JWT signing key
              JWT_SECRET=$(aws secretsmanager get-secret-value \
                --secret-id arch-analyzer/auth/jwt \
                --query SecretString \
                --output text)
              echo "$JWT_SECRET" > /secrets/jwt.json

              # Materialise Kubernetes Secret registration-secret
              # (consumed by the main container via secretRef)
              # The orchestrator / CI applies this secret before rollout;
              # the init container writes the raw values to the in-memory
              # volume so the app can also read them directly if needed.
              CONNECTION_STRING=$(echo "$DB_SECRET" | tr -d '\n')
              JWT_KEY=$(echo "$JWT_SECRET" | tr -d '\n')

              kubectl create secret generic registration-secret \
                --namespace arch-analyzer-api \
                --from-literal=ConnectionStrings__DefaultConnection="$CONNECTION_STRING" \
                --from-literal=Jwt__Key="$JWT_KEY" \
                --dry-run=client -o yaml | kubectl apply -f - || true
          volumeMounts:
            - name: secrets-vol
              mountPath: /secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

      containers:
        - name: registration-api
          image: arch-analyzer-registration:latest
          # Image resolved at deploy time via kustomization.yaml images override:
          #   newName: ${ECR_REGISTRY}/arch-analyzer-registration
          #   newTag:  ${IMAGE_TAG}
          ports:
            - containerPort: 5002

          envFrom:
            - configMapRef:
                name: infra-outputs # AWS_REGION, DB_ADDRESS, DB_PORT, SQS_*, S3_*, ECR_*
            - configMapRef:
                name: registration-config # ASPNETCORE_ENVIRONMENT, logging, feature flags
            - secretRef:
                name: registration-secret # ConnectionStrings__DefaultConnection, Jwt__Key

          volumeMounts:
            - name: secrets-vol
              mountPath: /secrets
              readOnly: true

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          livenessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 5
            periodSeconds: 5
