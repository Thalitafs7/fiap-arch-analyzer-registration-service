version: '3.8'

services:
  # Infraestrutura compartilhada
  postgres:
    image: postgres:16-alpine
    container_name: integration-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_MULTIPLE_DATABASES=cadastros_db,ordens_db,estoque_db
    ports:
      - "5432:5432"
    volumes:
      - ./init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - integration-network

  mongo:
    image: mongo:7
    container_name: integration-mongo
    ports:
      - "27017:27017"
    networks:
      - integration-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: integration-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - integration-network

  # Microsserviços
  ms-cadastros-api:
    build:
      context: ../../../ms-cadastros
      dockerfile: Dockerfile
    container_name: integration-ms-cadastros
    ports:
      - "5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5001
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=cadastros_db;Username=postgres;Password=postgres
      - Jwt__Key=ChaveSecretaMuitoSeguraParaJWTMecanicaOS2024!@#$%
      - Jwt__Issuer=ms-cadastros
      - Jwt__Audience=mecanicaos
      - Jwt__ExpiracaoMinutos=120
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - integration-network

  ms-ordens-api:
    build:
      context: ../../../ms-ordens
      dockerfile: Dockerfile
    container_name: integration-ms-ordens
    ports:
      - "5002:5002"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5002
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=ordens_db;Username=postgres;Password=postgres
      - ConnectionStrings__MongoConnection=mongodb://mongo:27017
      - MongoDB__DatabaseName=ordens_db
      - Jwt__Key=ChaveSecretaMuitoSeguraParaJWTMecanicaOS2024!@#$%
      - Jwt__Issuer=ms-cadastros
      - Jwt__Audience=mecanicaos
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__User=guest
      - RabbitMQ__Password=guest
      - Services__MsCadastros__BaseUrl=http://ms-cadastros-api:5001
      - MercadoPago__UseFake=true
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_started
      ms-cadastros-api:
        condition: service_started
    networks:
      - integration-network

  ms-estoque-api:
    build:
      context: ../../../ms-estoque
      dockerfile: Dockerfile
    container_name: integration-ms-estoque
    ports:
      - "5003:5003"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5003
      - ConnectionStrings__PostgresConnection=Host=postgres;Port=5432;Database=estoque_db;Username=postgres;Password=postgres
      - ConnectionStrings__MongoConnection=mongodb://mongo:27017
      - Jwt__Key=ChaveSecretaMuitoSeguraParaJWTMecanicaOS2024!@#$%
      - Jwt__Issuer=ms-cadastros
      - Jwt__Audience=mecanicaos
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__User=guest
      - RabbitMQ__Password=guest
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - integration-network

networks:
  integration-network:
    driver: bridge
