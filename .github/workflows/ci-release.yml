name: CI Release Branch

on:
  push:
    branches:
      - "release/*"

permissions:
  contents: write
  pull-requests: write

jobs:
  create-main-pr:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Pull Request to Main
        run: |
          HEAD_BRANCH="${{ github.ref_name }}"
          BASE_BRANCH="main"

          COMMIT_COUNT=$(git rev-list --count origin/$BASE_BRANCH..$HEAD_BRANCH)

          if [ "$COMMIT_COUNT" -eq "0" ]; then
            echo "No new commits between $HEAD_BRANCH and $BASE_BRANCH. Skipping PR creation."
            exit 0
          fi

          PR_EXISTS=$(gh pr list --head "$HEAD_BRANCH" --base "$BASE_BRANCH" --json number --jq 'length > 0')

          if [ "$PR_EXISTS" = "false" ]; then
            gh pr create \
              --title "Finalize Release $HEAD_BRANCH" \
              --body "Automated PR from release branch to main." \
              --base "$BASE_BRANCH" \
              --head "$HEAD_BRANCH"
          else
            echo "PR already exists for $HEAD_BRANCH to $BASE_BRANCH."
          fi
