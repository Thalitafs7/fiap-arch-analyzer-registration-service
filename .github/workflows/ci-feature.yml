name: CI Feature Branch

on:
  push:
    branches:
      - "feature/*"

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Develop Branch Exists
        run: |
          if ! git rev-parse --verify origin/develop >/dev/null 2>&1; then
            echo "Branch 'develop' does not exist. Creating it from 'main'..."
            git checkout -b develop origin/main
            git push origin develop
          else
            echo "Branch 'develop' already exists."
          fi

      - name: Create Pull Request to Develop
        run: |
          HEAD_BRANCH="${{ github.ref_name }}"
          BASE_BRANCH="develop"

          COMMIT_COUNT=$(git rev-list --count origin/$BASE_BRANCH..$HEAD_BRANCH)

          if [ "$COMMIT_COUNT" -eq "0" ]; then
            echo "No new commits between $HEAD_BRANCH and $BASE_BRANCH. Skipping PR creation."
            exit 0
          fi

          PR_EXISTS=$(gh pr list --head "$HEAD_BRANCH" --base "$BASE_BRANCH" --json number --jq 'length > 0')

          if [ "$PR_EXISTS" = "false" ]; then
            gh pr create \
              --title "Merge $HEAD_BRANCH into develop" \
              --body "Automated PR from feature branch to develop." \
              --base "$BASE_BRANCH" \
              --head "$HEAD_BRANCH"
          else
            echo "PR already exists for $HEAD_BRANCH to $BASE_BRANCH."
          fi
